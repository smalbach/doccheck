name: Release

# Builds the desktop app (apps/desktop) on each platform's own runner and attaches the installers
# to the GitHub release of the tag. The landing page (apps/landing) links to them by fixed name
# through releases/latest/download/<name>:
#   DocCheck-windows-setup.exe   DocCheck-mac-arm64.dmg   DocCheck-linux.AppImage   DocCheck-linux.deb
#
#   git tag v0.1.0 && git push origin v0.1.0     build and publish a release
#   Actions > Release > Run workflow             build only (installers kept as run artifacts)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the release (draft until every platform is attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "DocCheck $GITHUB_REF_NAME"

  build:
    needs: create-release
    # Runs on manual dispatch too, where create-release is skipped.
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            assets: apps/desktop/release/DocCheck-windows-setup.exe
          - name: mac
            os: macos-latest
            assets: apps/desktop/release/DocCheck-mac-arm64.dmg
          - name: linux
            os: ubuntu-latest
            assets: apps/desktop/release/DocCheck-linux.AppImage apps/desktop/release/DocCheck-linux.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Set the app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: apps/desktop
      - run: npm ci
        working-directory: apps/desktop
      - name: Package the installer
        run: npm run dist
        working-directory: apps/desktop
        env:
          # Unsigned builds: no certificate lookup on macOS or Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: DocCheck-${{ matrix.name }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.assets }} --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
