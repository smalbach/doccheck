<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>DocCheck</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: #0f1419; color: #e6edf3;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { text-align: center; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0; color: #9aa7b4; }
  .bar { width: 220px; height: 3px; margin: 24px auto 0; background: #222b35; border-radius: 3px; overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #3fb68b; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>DocCheck</h1>
  <p>Starting the database and the server…</p>
  <div class="bar" role="progressbar" aria-label="Starting"></div>
</main>
</body>
</html>
