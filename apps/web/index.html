<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocCheck</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f766e'/><path d='M8.5 5.5h8.2l5.3 5.3v14.7a2 2 0 0 1-2 2H8.5a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2z' fill='%23fff'/><path d='M16.7 5.5v4.3a1 1 0 0 0 1 1H22' fill='none' stroke='%2399d5cd' stroke-width='1.3' stroke-linejoin='round'/><path d='M9.6 18.6l2.8 2.8 5-5.6' fill='none' stroke='%230f766e' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/><path d='M24.5 3Q24.5 8 29.5 8Q24.5 8 24.5 13Q24.5 8 19.5 8Q24.5 8 24.5 3Z' fill='%23fbbf24' stroke='%230f766e' stroke-width='1.2' stroke-linejoin='round' paint-order='stroke'/><path d='M27 13.3Q27 15.5 29.2 15.5Q27 15.5 27 17.7Q27 15.5 24.8 15.5Q27 15.5 27 13.3Z' fill='%23fbbf24'/></svg>" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Before the first paint, so a chosen theme or language does not flash the default one.
      try {
        var theme = localStorage.getItem('doccheck.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        var locale = localStorage.getItem('doccheck.locale');
        if (locale === 'en' || locale === 'es' || locale === 'fr') document.documentElement.lang = locale;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
