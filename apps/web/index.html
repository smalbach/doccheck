<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocCheck</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f766e'/><path d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Before the first paint, so a chosen theme or language does not flash the default one.
      try {
        var theme = localStorage.getItem('doccheck.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        var locale = localStorage.getItem('doccheck.locale');
        if (locale === 'en' || locale === 'es' || locale === 'fr') document.documentElement.lang = locale;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
