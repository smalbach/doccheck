<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocCheck</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f766e'/><path d='M6 11V7a1 1 0 0 1 1-1h4M21 6h4a1 1 0 0 1 1 1v4M26 21v4a1 1 0 0 1-1 1h-4M11 26H7a1 1 0 0 1-1-1v-4' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/><path d='M10 9h5a7 7 0 0 1 0 14h-5z' fill='%23fff'/><path d='M12.5 12.2L18.5 16M12.5 16H18.5M12.5 19.8L18.5 16' stroke='%235fb3a8' stroke-width='1'/><circle cx='12.5' cy='12.2' r='1.3' fill='%230f766e'/><circle cx='12.5' cy='16' r='1.3' fill='%230f766e'/><circle cx='12.5' cy='19.8' r='1.3' fill='%230f766e'/><path d='M20.6 18.1L23.8 21.3' stroke='%23fbbf24' stroke-width='2' stroke-linecap='round'/><circle cx='18.5' cy='16' r='3' fill='%230f766e'/><path d='M17.1 16.1l1 1 1.9-2.1' fill='none' stroke='%23fbbf24' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Before the first paint, so a chosen theme, look or language does not flash the default one.
      try {
        var theme = localStorage.getItem('doccheck.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        var locale = localStorage.getItem('doccheck.locale');
        if (locale === 'en' || locale === 'es' || locale === 'fr') document.documentElement.lang = locale;
        // Accent, tone, radius, panels… (preferences/appearance.ts); unknown values match no CSS rule.
        var look = JSON.parse(localStorage.getItem('doccheck.appearance') || '{}');
        ['accent', 'tone', 'radius', 'panels', 'density', 'font', 'sidebar', 'motion'].forEach(function (key) {
          if (typeof look[key] === 'string' && /^[a-z]+$/.test(look[key])) document.documentElement.dataset[key] = look[key];
        });
        if (look.accent === 'custom' && look.vars) {
          ['accent-l', 'accent-d', 'on-accent-l', 'on-accent-d'].forEach(function (name) {
            if (/^#[0-9a-f]{6}$/i.test(look.vars[name])) document.documentElement.style.setProperty('--' + name, look.vars[name]);
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
